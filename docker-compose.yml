services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
      - "127.0.0.1:6080:6080"  # noVNC: http://localhost:6080/vnc.html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      # /api/health runs SELECT 1 against SQL Server, so "healthy" means the DB is reachable too.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5173/api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
