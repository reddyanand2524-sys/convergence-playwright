[pytest]
# Collect tests only from tests/. Running a bare `pytest` from backend/ otherwise also collects
# application modules whose names match test_*.py (app/models/test_result.py, app/services/
# test_file_selection.py): the model gets imported a second time under another module name and
# SQLAlchemy raises "Table 'test_results' is already defined for this MetaData instance".
# (The execution engine runs pytest in a temporary directory with its own rootdir, so this file
# does not affect uploaded tests.)
testpaths = tests
